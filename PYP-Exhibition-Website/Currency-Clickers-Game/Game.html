<!DOCTYPE html>
<html>
  <head>
    <title>Currency Clickers Game</title>
    <link rel="stylesheet" href="Game.css">
    <link rel="icon" href="../images/PYP-Exhibition-Group-Logo.png" type="image/png">
  </head>
  <body>
    <div class="game-container">
      <header class="main-heading-container">
        <a href="../index.html">
          <img src="../images/PYP-Exhibition-Group-Logo.png" class="group-logo">
        </a>
        <h1 class="main-heading">Currency Clickers Game</h1>
        <a class="nav-button" href="../About.html" target="_blank">About</a>
      </header>
      <div class="money-reset-button-container">
        <div class="money-container">
          <img src="../images/money-note.png" id="money-note-image">
          <p class="user-money"></p>
        </div>
        <button class="reset-button">Reset</button>
      </div>
      <div class="apple-image-container">
        <img src="../images/Apple.png" id="apple-image">
      </div>
      <div class="upgrade-autoclickers">
        <div class="upgrades-container upgrade-item-div">
          <p class="info upgrade-info"></p>
          <button class="buy-button upgrade-button">Buy</button>
        </div>
        <button class="stop-autoclicker">Stop Autoclicker</button>
        <div class="autoclickers-container upgrade-item-div">
          <p class="info autoclicker-info"></p>
          <button class="buy-button autoclicker-upgrade-button">Buy</button>
        </div>
      </div>
    </div>
    <script src="Game.js"></script>
  </body>
</html>
